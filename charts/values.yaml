postgrest:
  databases:
    - name: "authenticationprovider"
      host: "pg-cluster.{{ .Values.cluster.commonToolsNamespace }}.svc.cluster.local"
      port: "5432"
      database: "{{ .Values.cluster.namespace }}_authenticationprovider"
      user: "{{ .Values.namespaceTag.consumer }}_authenticationprovider"
      password: "vault:{{ .Values.secrets.secretEngine }}/data/{{ .Values.cluster.namespace }}-postgres-passwords#{{ .Values.cluster.namespace }}-authenticationprovider"
      anonRole: "{{ .Values.namespaceTag.consumer }}_authenticationprovider"
      dbPool: 1
    - name: usersroles
      host: "pg-cluster.{{ .Values.cluster.commonToolsNamespace }}.svc.cluster.local"
      port: "5432"
      database: "{{ .Values.cluster.namespace }}_usersroles"
      user: "{{ .Values.namespaceTag.consumer }}_usersroles"
      password: "vault:{{ .Values.secrets.secretEngine }}/data/{{ .Values.cluster.namespace }}-postgres-passwords#{{ .Values.cluster.namespace }}-usersroles"
      anonRole: "{{ .Values.namespaceTag.consumer }}_usersroles"
      dbPool: 1
development:
  enableTestConfigurations: false

eidas:
  enabled: false

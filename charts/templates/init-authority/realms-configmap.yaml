apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.keycloak.chart_name }}-realms
data:
{{- if .Values.eidas.enabled }}
  participant-realm.json: |-
{{ .Files.Get "data/keycloak/participant-with-eidas.json" | indent 4 }}
{{- else }}
  participant-realm.json: |-
{{ .Files.Get "data/keycloak/participant.json" | indent 4 }}
{{- end }}

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ .Values.argocd.appname }}
  namespace: {{ .Values.argocd.namespace }}
spec:
  syncPolicy:
    automated:
      enabled: false
    syncOptions:
      - ApplyOutOfSyncOnly=true
      - CreateNamespace=true
      - ServerSideApply=true
  project: {{ .Values.project }}
  destination:
    server: {{ .Values.cluster.address }}
    namespace: {{ .Values.cluster.namespace }}
  sources:
  - repoURL: {{ .Values.values.repo_URL }}
    targetRevision: {{ .Values.values.branch }}
    ref: values
  {{- if .Values.keycloak.enabled }}
  - repoURL: {{ .Values.keycloak.repo_URL }}
    targetRevision: {{ .Values.keycloak.targetRevision }}
    chart: {{ .Values.keycloak.chart_name }}
    helm:
      valueFiles:
        {{- range .Values.keycloak.valueFiles }}
        - $values/app-values/Keycloak/{{ . }}
        {{- end }}
        {{- if .Values.development.enableTestConfigurations }}
        - $values/app-values/Keycloak/values-test.yaml
        {{- end }}
      values: |
        global:
          security:
            allowInsecureImages: true
        image:
          repository: keycloak/keycloak
          tag: 26.4
        defaultInitContainers:
          prepareWriteDirs:
            enabled: false
        command:
          - /opt/keycloak/bin/kc.sh
        args:
          - start
          - --import-realm
          - --verbose
          - --proxy-headers
          - xforwarded
        containerSecurityContext:
          runAsUser: 1000
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
        fullnameOverride: {{ .Values.keycloak.nameOverride }}
        apiUrl: "https://participant.be.{{ .Values.namespaceTag.consumer }}.{{ .Values.domainSuffix }}"
        podAnnotations:
          vault.security.banzaicloud.io/vault-addr: "https://secrets.{{ .Values.namespaceTag.common }}.{{ .Values.domainSuffix }}"
          vault.security.banzaicloud.io/vault-role: {{ .Values.secrets.role }}
          vault.security.banzaicloud.io/vault-path: kubernetes
          vault.security.banzaicloud.io/vault-skip-verify: "true"
        auth:
          adminPassword: vault:{{ .Values.secrets.secretEngine }}/data/{{ .Values.cluster.namespace }}-keycloak#admin
        externalDatabase:
          host: "pg-cluster.{{ .Values.cluster.commonToolsNamespace }}.svc.cluster.local"
          database: {{ .Values.namespaceTag.consumer }}_keycloak
          user: {{ .Values.namespaceTag.consumer }}_keycloak
          password: vault:{{ .Values.secrets.secretEngine }}/data/{{ .Values.cluster.namespace }}-postgres-passwords#{{ .Values.cluster.namespace }}-keycloak
        extraEnvVars:
        - name: KC_HOSTNAME_ADMIN
          value: "https://participant.be.{{ .Values.namespaceTag.consumer }}.{{ .Values.domainSuffix }}/auth"
        - name: KC_HOSTNAME
          value: "https://participant.be.{{ .Values.namespaceTag.consumer }}.{{ .Values.domainSuffix }}/auth"
        - name: USERS_ROLES_BASE_URL
          value: "http://users-roles.{{ .Values.cluster.namespace }}.svc.cluster.local:8080/tier1/v2"
        - name: AUTHENTICATION_PROVIDER_BASE_URL
          value: "http://authentication-provider.{{ .Values.cluster.namespace }}.svc.cluster.local:8080/tier1/v2"
        - name: KEYCLOAK_BASE_URL
          value: "https://participant.be.{{ .Values.namespaceTag.consumer }}.{{ .Values.domainSuffix }}/auth"
        - name: REALM
          value: "participant"
        - name: KEYCLOAK_ADMIN
          value: "admin"
        - name: KEYCLOAK_ADMIN_PASSWORD
          value: "vault:{{ .Values.secrets.secretEngine }}/data/{{ .Values.cluster.namespace }}-keycloak#admin"
        - name: KC_DB
          value: "postgres"
        - name: KC_DB_URL_HOST
          value: "pg-cluster.{{ .Values.cluster.commonToolsNamespace }}.svc.cluster.local"
        - name: KC_DB_URL_PORT
          value: "5432"
        - name: KC_DB_URL_DATABASE
          value: {{ .Values.namespaceTag.consumer }}_keycloak
        - name: KC_DB_USERNAME
          value: {{ .Values.namespaceTag.consumer }}_keycloak
        - name: KC_DB_PASSWORD
          value: "vault:{{ .Values.secrets.secretEngine }}/data/{{ .Values.cluster.namespace }}-postgres-passwords#{{ .Values.cluster.namespace }}-keycloak"
        - name: KC_BOOTSTRAP_ADMIN_USERNAME
          value: "admin"
        - name: KC_BOOTSTRAP_ADMIN_PASSWORD
          value: "vault:{{ .Values.secrets.secretEngine }}/data/{{ .Values.cluster.namespace }}-keycloak#admin"
        extraVolumes:
          - name: spi-volume
            emptyDir: {}
          - name: realm-volume
            configMap:
              name: {{ .Values.keycloak.chart_name }}-realms
        extraVolumeMounts:
          - name: spi-volume
            mountPath: /opt/keycloak/providers
          - name: realm-volume
            mountPath: /opt/keycloak/data/import
        initContainers:
        - name: init-spi
          image: curlimages/curl
          command: ["/bin/sh", "-c"]
          env:
            - name: ARTIFACT
              value: keycloak-authenticator
            - name: URL
              value: https://code.europa.eu/api/v4/projects/915/packages/maven/eu/europa/ec/simpl/keycloak-authenticator/{{ .Values.keycloak.keycloak_authenticator.targetRevision }}/keycloak-authenticator-{{ .Values.keycloak.keycloak_authenticator.targetRevision }}.jar
            - name: EIDAS_EXTENSION_ARTIFACT
              value: keycloak-eidas-demo-authenticator
            - name: EIDAS_EXTENSION_URL
              value: https://code.europa.eu/api/v4/projects/1313/packages/maven/eu/europa/ec/simpl/eidas-demo-keycloak-extension/{{ .Values.keycloak.eidas_demo_keycloak_extension.targetRevision }}/eidas-demo-keycloak-extension-{{ .Values.keycloak.eidas_demo_keycloak_extension.targetRevision }}.jar
          args:
            - |
              curl -o /custom-spi/${ARTIFACT}.jar ${URL};
              curl -o /custom-spi/${EIDAS_EXTENSION_ARTIFACT}.jar ${EIDAS_EXTENSION_URL};
          volumeMounts:
            - name: spi-volume
              mountPath: /custom-spi
        {{- if .Values.keycloak.resourcesPreset }}
        resourcesPreset: {{ .Values.keycloak.resourcesPreset }}
        {{- end }}
        {{- if eq .Values.resourcePreset "low" }}
        resources:
          requests:
            cpu: "0"
            memory: "0"
        {{- else }}
          {{- if .Values.keycloak.resources }}
        resources: {{- toYaml .Values.keycloak.resources | nindent 10 }}
          {{- end }}
        {{- end }}
  {{- end }}
  {{- if .Values.auth_provider.enabled }}
  - repoURL: "https://code.europa.eu/api/v4/projects/{{ .Values.auth_provider.projectID }}/packages/helm/stable"
    path: ''
    targetRevision: {{ .Values.auth_provider.targetRevision }}
    chart: {{ .Values.auth_provider.chart_name }}
    helm:
      valueFiles:
        {{- range .Values.auth_provider.valueFiles }}
        - $values/app-values/auth-provider/{{ . }}
        {{- end }}
        {{- if .Values.development.enableTestConfigurations }}
        - $values/app-values/auth-provider/values-test.yaml
        {{- end }}
      values: |
        podAnnotations:
          vault.security.banzaicloud.io/vault-addr: "https://secrets.{{ .Values.namespaceTag.common }}.{{ .Values.domainSuffix }}"
          vault.security.banzaicloud.io/vault-role: {{ .Values.secrets.role }}
          vault.security.banzaicloud.io/vault-path: kubernetes
          vault.security.banzaicloud.io/vault-skip-verify: "true"
        appConfig:
          spring:
            datasource:
              {{- with .Values.backendExtraGlobalDatasource }}
              {{ . | nindent 14 }}
              {{- end }}
          management:
            otlp:
              tracing:
                endpoint: http://collector.{{ .Values.namespaceTag.common }}.{{ .Values.domainSuffix }}
          spring:
            data:
              redis:
                host: "redis-master.{{ .Values.cluster.namespace }}.svc.cluster.local"
            datasource:
              url: "jdbc:postgresql://pg-cluster.{{ .Values.cluster.commonToolsNamespace }}.svc.cluster.local:5432/{{ .Values.cluster.namespace }}_authenticationprovider"
              username: {{ .Values.namespaceTag.consumer }}_authenticationprovider
              {{- with .Values.backendExtraGlobalDatasource }}
              {{ . | nindent 14 }}
              {{- end }}
          microservice:
            identity-provider:
              url: http://identity-provider.{{ .Values.cluster.namespace }}.svc.cluster.local:8080
          client:
            authority:
              url: "https://tls.authority.{{ .Values.namespaceTag.authority }}.{{ .Values.authorityDomainSuffix }}"
          simpl:
            certificate:
              san: "tls.participant.{{ .Values.namespaceTag.consumer }}.{{ .Values.domainSuffix }}"
          openid-connect:
            certsEndpoint: "https://participant.be.{{ .Values.namespaceTag.consumer }}.{{ .Values.domainSuffix }}/auth/realms/participant/protocol/openid-connect/certs"
        env:
        - name: LOGGING_LEVEL_EU_EUROPA_EC_SIMPL
          value: "DEBUG"
        - name: SPRING_JPA_SHOW_SQL
          value: "false"
        - name: KAFKA_AUTHPROVIDER
          value: "vault:{{ .Values.secrets.secretEngine }}/data/{{ .Values.cluster.commonToolsNamespace }}-kafka-credentials#{{ .Values.cluster.namespace }}_authprovider"
        - name: SPRING_DATA_REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: redis-secrets
              key: redis
        - name: SPRING_DATASOURCE_PASSWORD
          value: "vault:{{ .Values.secrets.secretEngine }}/data/{{ .Values.cluster.namespace }}-postgres-passwords#{{ .Values.cluster.namespace }}-authenticationprovider"
        kafkaConfig:
          spring:
            kafka:
              bootstrap-servers: kafka.{{ .Values.cluster.commonToolsNamespace }}.svc.cluster.local:9092
              producer:
                properties:
                  security.protocol: SASL_PLAINTEXT
                  sasl.mechanism: PLAIN
                  sasl.jaas.config: org.apache.kafka.common.security.plain.PlainLoginModule required username="{{ .Values.cluster.namespace }}_authprovider" password="${KAFKA_AUTHPROVIDER}";
              admin:
                auto-create: true
          simpl:
            kafka:
              topic:
                prefix: iaa.{{ .Values.cluster.namespace }}.
        {{- if eq .Values.resourcePreset "low" }}
        resources:
          requests:
            cpu: "0"
            memory: "0"
        {{- else }}
          {{- if .Values.auth_provider.resources }}
        resources: {{- toYaml .Values.auth_provider.resources | nindent 10 }}
          {{- end }}
        {{- end }}
  {{- end }}
  {{- if .Values.users_roles.enabled }}
  - repoURL: "https://code.europa.eu/api/v4/projects/{{ .Values.users_roles.projectID }}/packages/helm/stable"
    path: ''
    targetRevision: {{ .Values.users_roles.targetRevision }}
    chart: {{ .Values.users_roles.chart_name }}
    helm:
      valueFiles:
        {{- range .Values.users_roles.valueFiles }}
        - $values/app-values/Users-Roles/{{ . }}
        {{- end }}
        {{- if .Values.development.enableTestConfigurations }}
        - $values/app-values/Users-Roles/values-test.yaml
        {{- end }}
      values: |
        podAnnotations:
          vault.security.banzaicloud.io/vault-addr: "https://secrets.{{ .Values.namespaceTag.common }}.{{ .Values.domainSuffix }}"
          vault.security.banzaicloud.io/vault-role: {{ .Values.secrets.role }}
          vault.security.banzaicloud.io/vault-path: kubernetes
          vault.security.banzaicloud.io/vault-skip-verify: "true"
        hostT1: participant.be.{{ .Values.namespaceTag.consumer }}.{{ .Values.domainSuffix }}
        authorityHostT2: tls.authority.{{ .Values.namespaceTag.authority }}.{{ .Values.authorityDomainSuffix }}
        global:
          ingress:
            issuer: {{ .Values.cluster.issuer }}
        keycloak:
          master:
            password: vault:{{ .Values.secrets.secretEngine }}/data/{{ .Values.cluster.namespace }}-keycloak#admin
        db:
          url: "jdbc:postgresql://pg-cluster.{{ .Values.cluster.commonToolsNamespace }}.svc.cluster.local:5432/{{ .Values.cluster.namespace }}_usersroles"
          username: {{ .Values.namespaceTag.consumer }}_usersroles
          password: vault:{{ .Values.secrets.secretEngine }}/data/{{ .Values.cluster.namespace }}-postgres-passwords#{{ .Values.cluster.namespace }}-usersroles
        appConfig:
          spring:
            datasource:
              {{- with .Values.backendExtraGlobalDatasource }}
              {{ . | nindent 14 }}
              {{- end }}
          notification:
            role-requests:
              my-profile-url: https://participant.fe.{{ .Values.namespaceTag.consumer }}.{{ .Values.domainSuffix }}/users-roles/my-profile
              role-request-review-page: https://participant.fe.{{ .Values.namespaceTag.consumer }}.{{ .Values.domainSuffix }}/users-roles/role-requests-management/review/{roleRequestId}
        env:
        - name: LOGGING_LEVEL_EU_EUROPA_EC_SIMPL
          value: "DEBUG"
        - name: SPRING_JPA_SHOW_SQL
          value: "false"
        - name: KAFKA_USERSROLES
          value: "vault:{{ .Values.secrets.secretEngine }}/data/{{ .Values.cluster.commonToolsNamespace }}-kafka-credentials#{{ .Values.cluster.namespace }}_usersroles"
        microservices:
          authenticationProviderUrl: http://authentication-provider.{{ .Values.cluster.namespace }}.svc.cluster.local:8080
        kafkaConfig:
          spring:
            kafka:
              bootstrap-servers: kafka.{{ .Values.cluster.commonToolsNamespace }}.svc.cluster.local:9092
              producer:
                properties:
                  security.protocol: SASL_PLAINTEXT
                  sasl.mechanism: PLAIN
                  sasl.jaas.config: org.apache.kafka.common.security.plain.PlainLoginModule required username="{{ .Values.cluster.namespace }}_usersroles" password="${KAFKA_USERSROLES}";
              consumer:
                group-id: users-roles
                properties:
                  security.protocol: SASL_PLAINTEXT
                  sasl.mechanism: PLAIN
                  sasl.jaas.config: org.apache.kafka.common.security.plain.PlainLoginModule required username="{{ .Values.cluster.namespace }}_usersroles" password="${KAFKA_USERSROLES}";
              admin:
                auto-create: true
          simpl:
            kafka:
              topic:
                prefix: iaa.{{ .Values.cluster.namespace }}.
              inbox:
                topic:
                  pattern: iaa\.{{ .Values.cluster.namespace }}\..*
        {{- if eq .Values.resourcePreset "low" }}
        resources:
          requests:
            cpu: "0"
            memory: "0"
        {{- else }}
          {{- if .Values.users_roles.resources }}
        resources: {{- toYaml .Values.users_roles.resources | nindent 10 }}
          {{- end }}
        {{- end }}
  {{- end }}
  {{- if .Values.users_roles_fe.enabled }}
  - repoURL: "https://code.europa.eu/api/v4/projects/{{ .Values.users_roles_fe.projectID }}/packages/helm/stable"
    path: ''
    targetRevision: {{ .Values.users_roles_fe.targetRevision }}
    chart: {{ .Values.users_roles_fe.chart_name }}
    helm:
      values: |
        # ingress:
        #   issuer: {{ .Values.cluster.issuer }}
        hostFe: participant.fe.{{ .Values.namespaceTag.consumer }}.{{ .Values.domainSuffix }}
        ingress:
          issuer: {{ .Values.cluster.issuer }}
        cors:
          allowOrigin: https://participant.fe.{{ .Values.namespaceTag.consumer }}.{{ .Values.domainSuffix }},https://participant.be.{{ .Values.namespaceTag.consumer }}.{{ .Values.domainSuffix }},http://localhost:4202,http://localhost:4203,http://localhost:3000
        env:
        - name: API_URL
          value: "https://participant.be.{{ .Values.namespaceTag.consumer }}.{{ .Values.domainSuffix }}"
        - name: KEYCLOAK_URL
          value: "https://participant.be.{{ .Values.namespaceTag.consumer }}.{{ .Values.domainSuffix }}/auth"
        - name: KEYCLOAK_REALM
          value: "participant"
        - name: KEYCLOAK_CLIENT_ID
          value: "frontend-cli"
        {{- if eq .Values.resourcePreset "low" }}
        resources:
          requests:
            cpu: "0"
            memory: "0"
        {{- else }}
          {{- if .Values.users_roles_fe.resources }}
        resources: {{- toYaml .Values.users_roles_fe.resources | nindent 10 }}
          {{- end }}
        {{- end }}
  {{- end }}
  {{- if .Values.authentication_provider_fe.enabled }}
  - repoURL: "https://code.europa.eu/api/v4/projects/{{ .Values.authentication_provider_fe.projectID }}/packages/helm/stable"
    path: ''
    targetRevision: {{ .Values.authentication_provider_fe.targetRevision }}
    chart: {{ .Values.authentication_provider_fe.chart_name }}
    helm:
      values: |
        # ingress:
        #   issuer: {{ .Values.cluster.issuer }}
        hostFe: participant.fe.{{ .Values.namespaceTag.consumer }}.{{ .Values.domainSuffix }}
        ingress:
          issuer: {{ .Values.cluster.issuer }}
        cors:
          allowOrigin: https://participant.fe.{{ .Values.namespaceTag.consumer }}.{{ .Values.domainSuffix }},https://participant.be.{{ .Values.namespaceTag.consumer }}.{{ .Values.domainSuffix }},http://localhost:4202,http://localhost:4203,http://localhost:3000
        env:
        - name: API_URL
          value: "https://participant.be.{{ .Values.namespaceTag.consumer }}.{{ .Values.domainSuffix }}"
        - name: KEYCLOAK_URL
          value: "https://participant.be.{{ .Values.namespaceTag.consumer }}.{{ .Values.domainSuffix }}/auth"
        - name: KEYCLOAK_REALM
          value: "participant"
        - name: KEYCLOAK_CLIENT_ID
          value: "frontend-cli"
        {{- if eq .Values.resourcePreset "low" }}
        resources:
          requests:
            cpu: "0"
            memory: "0"
        {{- else }}
          {{- if .Values.authentication_provider_fe.resources }}
        resources: {{- toYaml .Values.authentication_provider_fe.resources | nindent 10 }}
          {{- end }}
        {{- end }}
  {{- end }}
  {{- if .Values.tier1_gateway.enabled }}
  - repoURL: "https://code.europa.eu/api/v4/projects/{{ .Values.tier1_gateway.projectID }}/packages/helm/stable"
    path: ''
    targetRevision: {{ .Values.tier1_gateway.targetRevision }}
    chart: {{ .Values.tier1_gateway.chart_name }}
    helm:
      valueFiles:
        {{- range .Values.tier1_gateway.valueFiles }}
        - $values/app-values/tier1-gateway/{{ . }}
        {{- end }}
        {{- if .Values.development.enableTestConfigurations }}
        - $values/app-values/tier1-gateway/values-test.yaml
        {{- end }}
      values: |
        hostT1: participant.be.{{ .Values.namespaceTag.consumer }}.{{ .Values.domainSuffix }}
        cors:
          allowOrigin: https://participant.fe.{{ .Values.namespaceTag.consumer }}.{{ .Values.domainSuffix }},https://participant.be.{{ .Values.namespaceTag.consumer }}.{{ .Values.domainSuffix }},http://localhost:4202,http://localhost:3000
        ingress:
          issuer: {{ .Values.cluster.issuer }}
        keycloakUrl: http://keycloak.{{ .Values.cluster.namespace }}.svc.cluster.local
        usersRolesUrl: http://users-roles.{{ .Values.cluster.namespace }}.svc.cluster.local:8080
        authenticationProviderUrl: http://authentication-provider.{{ .Values.cluster.namespace }}.svc.cluster.local:8080
        env:
        - name: LOGGING_LEVEL_EU_EUROPA_EC_SIMPL
          value: "DEBUG"
        - name: SPRING_JPA_SHOW_SQL
          value: "false"
        {{- if eq .Values.resourcePreset "low" }}
        resources:
          requests:
            cpu: "0"
            memory: "0"
        {{- else }}
          {{- if .Values.tier1_gateway.resources }}
        resources: {{- toYaml .Values.tier1_gateway.resources | nindent 10 }}
          {{- end }}
        {{- end }}
  {{- end }}
  {{- if .Values.tier2_gateway.enabled }}
  - repoURL: "https://code.europa.eu/api/v4/projects/{{ .Values.tier2_gateway.projectID }}/packages/helm/stable"
    path: ''
    targetRevision: {{ .Values.tier2_gateway.targetRevision }}
    chart: {{ .Values.tier2_gateway.chart_name }}
    helm:
      valueFiles:
        {{- range .Values.tier2_gateway.valueFiles }}
        - $values/app-values/tier2-gateway/{{ . }}
        {{- end }}
        {{- if .Values.development.enableTestConfigurations }}
        - $values/app-values/tier2-gateway/values-test.yaml
        {{- end }}
      values: |
        podAnnotations:
          vault.security.banzaicloud.io/vault-addr: "https://secrets.{{ .Values.namespaceTag.common }}.{{ .Values.domainSuffix }}"
          vault.security.banzaicloud.io/vault-role: {{ .Values.secrets.role }}
          vault.security.banzaicloud.io/vault-path: kubernetes
          vault.security.banzaicloud.io/vault-skip-verify: "true"
        env:
        - name: LOGGING_LEVEL_EU_EUROPA_EC_SIMPL
          value: "DEBUG"
        - name: SPRING_JPA_SHOW_SQL
          value: "false"
        - name: KAFKA_TIER2GW
          value: "vault:{{ .Values.secrets.secretEngine }}/data/{{ .Values.cluster.commonToolsNamespace }}-kafka-credentials#{{ .Values.cluster.namespace }}_tier2gw"
        - name: SPRING_DATA_REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: redis-secrets
              key: redis
        cors:
            allowOrigin: https://authority.fe.{{ .Values.namespaceTag.authority }}.{{ .Values.authorityDomainSuffix }},https://authority.be.{{ .Values.namespaceTag.authority }}.{{ .Values.authorityDomainSuffix }},http://localhost:4202,http://localhost:3000
        kafka:
          bootstrap-servers: kafka.{{ .Values.cluster.commonToolsNamespace }}.svc.cluster.local:9092
        redis:
          host: "redis-master.{{ .Values.cluster.namespace }}.svc.cluster.local"
        hostT2: "tls.participant.{{ .Values.namespaceTag.consumer }}.{{ .Values.domainSuffix }}"
        authorityUrlT1: "https://authority.be.{{ .Values.namespaceTag.authority }}.{{ .Values.authorityDomainSuffix }}"
        kafkaConfig:
          spring:
            kafka:
              bootstrap-servers: kafka.{{ .Values.cluster.commonToolsNamespace }}.svc.cluster.local:9092
              consumer:
                properties:
                  security.protocol: SASL_PLAINTEXT
                  sasl.mechanism: PLAIN
                  sasl.jaas.config: org.apache.kafka.common.security.plain.PlainLoginModule required username="{{ .Values.cluster.namespace }}_tier2gw" password="${KAFKA_TIER2GW}";
              admin:
                auto-create: true
          simpl:
            kafka:
              topic:
                prefix: iaa.{{ .Values.cluster.namespace }}.
        {{- if eq .Values.resourcePreset "low" }}
        resources:
          requests:
            cpu: "0"
            memory: "0"
        {{- else }}
          {{- if .Values.tier2_gateway.resources }}
        resources: {{- toYaml .Values.tier2_gateway.resources | nindent 10 }}
          {{- end }}
        {{- end }}
  {{- end }}
  {{- if .Values.tier2_proxy.enabled }}
  - repoURL: "https://code.europa.eu/api/v4/projects/{{ .Values.tier2_proxy.projectID }}/packages/helm/stable"
    path: ''
    targetRevision: {{ .Values.tier2_proxy.targetRevision }}
    chart: {{ .Values.tier2_proxy.chart_name }}
    helm:
      values: |
        {{- if eq .Values.resourcePreset "low" }}
        resources:
          requests:
            cpu: "0"
            memory: "0"
        {{- else }}
          {{- if .Values.tier2_proxy.resources }}
        resources: {{- toYaml .Values.tier2_proxy.resources | nindent 10 }}
          {{- end }}
        {{- end }}
  {{- end }}
  {{- if .Values.redis.enabled }}
  - repoURL: {{ .Values.redis.repo_URL }}
    targetRevision: {{ .Values.redis.targetRevision }}
    chart: {{ .Values.redis.chart_name }}
    helm:
      valueFiles:
        {{- range .Values.redis.valueFiles }}
        - $values/app-values/Redis/{{ . }}
        {{- end }}
        {{- if .Values.development.enableTestConfigurations }}
        - $values/app-values/Redis/values-test.yaml
        {{- end }}
      values: |
        fullnameOverride: {{ .Values.redis.nameOverride }}
        master:
          podAnnotations:
            vault.security.banzaicloud.io/vault-addr: "https://secrets.{{ .Values.namespaceTag.common }}.{{ .Values.domainSuffix }}"
            vault.security.banzaicloud.io/vault-role: {{ .Values.secrets.role }}
            vault.security.banzaicloud.io/vault-path: kubernetes
            vault.security.banzaicloud.io/vault-skip-verify: "true"
          {{- if .Values.redis.resourcesPreset }}
          resourcesPreset: {{ .Values.redis.resourcesPreset }}
          {{- end }}
          {{- if eq .Values.resourcePreset "low" }}
          resources:
            requests:
              cpu: "0"
              memory: "0"
          {{- else }}

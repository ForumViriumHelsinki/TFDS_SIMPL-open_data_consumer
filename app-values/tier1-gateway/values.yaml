profile: participant
appConfig:
  external-routes:
    rbac:
    - path: /edc-connector-adapter/api/*/registration/register
      method: GET
      roles:
      - SD_PUBLISHER
    - path: /edc-connector-adapter/api/*/configuration/participant
      method: POST
      roles:
      - SD_PUBLISHER
    logging:
      business:
      - config:
          operations:
          - ADVANCED_SEARCH
        method: POST
        path: /xfsc-advsearch-be/v1/selfDescriptions/advanced
      - config:
          operations:
          - QUICK_SEARCH
        method: GET
        path: /xfsc-advsearch-be/v1/selfDescriptions
    spring-route-definitions:
    - id: contract-consumption-be
      uri: http://contract-consumption-be:8080
      predicates:
      - Path: /contract-consumption/**
      filters:
      - StripPrefix: 1
    - id: sdtooling-wizard-be
      uri: http://sd-creation-wizard-api:8080
      predicates:
      - Path: /sdtooling-api/**
      filters:
      - StripPrefix: 1
    - id: xfsc-advsearch-be
      uri: http://xfsc-advsearch-be:8080
      predicates:
      - Path: /xfsc-advsearch-be/**
      filters:
      - StripPrefix: 1
    - id: edc-connector
      uri: http://edc-connector-adapter:8080
      predicates:
      - Path: /edc-connector-adapter/**
      filters:
      - StripPrefix: 1
    - id: edc-management
      uri: http://simpl-edc-service:29193
      predicates:
      - Path: /edc/**
      filters:
      - StripPrefix: 1
    public-urls:
    - method: GET
      path: /actuator/health/**
  springdoc:
    swagger-ui:
      urls:
      - url: /userApi/openapi/usersroles-v1.yaml
        name: Users & Roles Service V1
      - url: /authApi/openapi/authenticationprovider-v1.yaml
        name: Authentication Provider Service V1
      - url: /openapi/tier1gateway-v1.yaml
        name: Application Info V1
  keycloak:
    app:
      realm: participant
  jwt-configuration:
    primary:
      realm: participant
